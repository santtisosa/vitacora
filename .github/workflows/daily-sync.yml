name: Daily sync

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 ART / 09:00 UTC
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - run: pip install -r requirements.txt

      # Token de Garmin persistido entre corridas: si no se restaura, cada
      # run intenta loguear de cero y eso es justo lo que dispara el
      # rate-limit por clientId+email (ver plan, riesgo #1).
      - uses: actions/cache@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokenstore

      - name: Restaurar credenciales de Google Health
        run: |
          mkdir -p ~/.vitacora
          echo "$GOOGLE_HEALTH_TOKEN_JSON" > ~/.vitacora/google_health_token.json
          echo "$GOOGLE_CLIENT_SECRETS_JSON" > client_secrets.json
        env:
          GOOGLE_HEALTH_TOKEN_JSON: ${{ secrets.GOOGLE_HEALTH_TOKEN_JSON }}
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}

      - name: Sync
        run: python run_daily_sync.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_CLIENT_SECRETS_PATH: client_secrets.json

      # Segunda pasada del motor determinista (ver plan Fase 3): recalcula
      # metric_rollup a partir de lo que acaba de escribir el sync. Corre
      # siempre, incluso si una fuente falló arriba -- lo que haya en
      # daily_metric se recalcula igual.
      - name: Compute rollups
        run: python compute_rollups.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
